<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FPS Kit HUD</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <!-- The HUD of the FPS kit: a transparent page over the game, fed by the `Hud` service (assets/services/hud.service.ts) through the Bridge. Nothing here is clickable. -->
  <div id="damage" class="damage"></div>

  <div id="indicator" class="indicator"><i></i></div>

  <div id="crosshair" class="crosshair">
    <span class="crosshair__tick -up"></span><span class="crosshair__tick -down"></span><span class="crosshair__tick -left"></span><span class="crosshair__tick -right"></span>
    <span class="crosshair__dot"></span>
    <svg class="crosshair__arcs" viewBox="-100 -100 200 200" aria-hidden="true"><circle class="crosshair__ring -shade" r="30" pathLength="360"></circle><circle class="crosshair__ring" r="30" pathLength="360"></circle></svg>
    <svg class="crosshair__twin" viewBox="-120 -120 240 240" aria-hidden="true">
      <g class="crosshair__side">
        <path class="crosshair__stroke -shade" data-kind="arc"></path><path class="crosshair__stroke" data-kind="arc"></path>
      </g>
      <g class="crosshair__side" transform="scale(-1 1)">
        <path class="crosshair__stroke -shade" data-kind="arc"></path><path class="crosshair__stroke" data-kind="arc"></path>
      </g>
    </svg>
    <span id="hitmarker" class="hitmarker"><i></i><i></i><i></i><i></i></span>
  </div>

  <div id="prompt" class="prompt"><span class="prompt__key">E</span><span id="promptText" class="prompt__text"></span></div>
  <div id="message" class="message"></div>

  <!-- What can be used, over it on the screen: filled by hud.js from the `Hud` service's markers. -->
  <div id="markers" class="markers"></div>

  <div class="status -health">
    <div class="status__label">Health</div>
    <div class="bar"><div id="healthFill" class="bar__fill"></div></div>
    <div id="healthText" class="status__value">100</div>
  </div>

  <div id="items" class="items"></div>

  <div class="status -ammo">
    <div id="weapons" class="weapons"></div>
    <div id="stance" class="status__label">Relaxed</div>
    <div class="ammo"><span id="ammo" class="ammo__loaded">0</span><span class="ammo__slash">/</span><span id="reserve" class="ammo__reserve">0</span></div>
  </div>

  <!-- The pause menu: shown by the `PauseMenu` service (assets/services/pause-menu.service.ts) when the game lets go of the pointer (Esc). Its controls are the only clickable things of the page. -->
  <div id="menu" class="menu" aria-hidden="true">
    <div class="menu__panel">
      <div class="menu__title">Paused</div>
      <label class="menu__row"><span class="menu__label">Mouse Sensitivity</span><input id="sensitivity" class="menu__slider" type="range" min="0.2" max="3" step="0.05"><span id="sensitivityValue" class="menu__value"></span></label>
      <label class="menu__row"><span class="menu__label">Field of View</span><input id="fieldOfView" class="menu__slider" type="range" min="50" max="110" step="1"><span id="fieldOfViewValue" class="menu__value"></span></label>
      <label class="menu__row"><span class="menu__label">Volume</span><input id="volume" class="menu__slider" type="range" min="0" max="1" step="0.01"><span id="volumeValue" class="menu__value"></span></label>
      <button id="resume" class="menu__button" type="button">Resume</button>
      <div class="menu__hint">or click anywhere on the game</div>
    </div>
  </div>

  <!-- The Journal (Datapad, its name comes from the game): what the player has found out, opened with Tab. Shown by the `Journal` service on the game side. Its controls are the only clickable things of the panel. -->
  <div id="journal" class="journal" aria-hidden="true">
    <div class="journal__frame">
      <nav class="journal__side">
        <div id="journalTitle" class="journal__heading"></div>
        <ul id="journalCategories" class="journal__categories"></ul>
        <div class="journal__hint">Tab to close</div>
      </nav>
      <section class="journal__stage">
        <div id="journalObject" class="journal__object"></div>
        <ul id="journalEntries" class="journal__entries"></ul>
      </section>
      <aside class="journal__detail">
        <h2 id="journalEntryTitle" class="journal__entry-title"></h2>
        <div id="journalEntryStatus" class="journal__status"></div>
        <div id="journalEntryBody" class="journal__body"></div>
        <button id="journalAudio" class="journal__audio" type="button" hidden>Play</button>
      </aside>
      <button id="journalClose" class="journal__close" type="button" aria-label="Close">&times;</button>
      <div id="journalEmpty" class="journal__empty">Nothing found yet.</div>
    </div>
  </div>

  <!-- The chip that says the Journal can be opened, and whether something new is in it. Not clickable; hidden while the Journal is open. -->
  <div id="journalHint" class="journal-hint"><span class="journal-hint__key">Tab</span><span id="journalHintTitle"></span><i class="journal-hint__dot"></i></div>

  <script src="vendor/ui-bridge.global.js"></script>
  <script src="hud.js"></script>
</body>
</html>
